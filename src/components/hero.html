<section
  id="beranda"
  class="relative w-full h-[600px] md:h-[650px] overflow-hidden"
>
  <!-- Gambar Background Full Width -->
  <div class="absolute inset-0 w-full h-full">
    <img
      src="src/assets/images/toko-daffa.png"
      alt="Toko Daffa"
      class="w-full h-full object-cover object-center"
    />
    <!-- Overlay gradasi hitam transparan agar teks terbaca dan transisi lebih halus -->
    <div
      class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/60 to-black/40"
    ></div>
  </div>

  <!-- Konten Teks di Atas Gambar -->
  <div class="absolute inset-0 flex items-center">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
      <div class="max-w-2xl text-white">
        <div
          class="inline-block bg-green-800/70 text-green-100 px-4 py-1.5 rounded-full text-sm font-semibold mb-4 border border-green-600 backdrop-blur-sm"
        >
          <i class="fas fa-fire mr-1 text-green-300"></i> Melayani
          perlengkapan sembako
        </div>
        <h1
          class="text-5xl sm:text-6xl md:text-7xl font-extrabold text-white leading-tight"
        >
          Toko <span class="text-green-300">Daffa</span>
        </h1>
        <p class="text-xl md:text-2xl text-green-100 mt-4 max-w-lg">
          Segala kebutuhan sembako, bensin eceran + tabung gas
          <span class="font-semibold text-white">LPG 3kg (melon)</span>.
          Harga ramah, pelayanan cepat.
        </p>
        <div class="flex flex-wrap gap-4 mt-8">
          <a
            href="#produk"
            class="bg-green-700 hover:bg-green-800 text-white px-7 py-3.5 rounded-full shadow-lg font-semibold transition flex items-center gap-2"
          >
            <i class="fas fa-basket-shopping"></i> Lihat produk
          </a>
          <a
            href="#kontak"
            class="bg-black/50 backdrop-blur-sm border-2 border-white text-white hover:bg-black/70 px-7 py-3.5 rounded-full shadow-md font-semibold transition flex items-center gap-2"
          >
            <i class="fas fa-location-dot"></i> Kunjungi toko
          </a>
        </div>
        <!-- info operasional -->
        <div
          class="mt-8 flex items-center text-green-100 bg-black/40 backdrop-blur-sm p-3 rounded-full w-fit gap-3 px-5 border border-green-700"
        >
          <i class="far fa-clock text-green-300"></i>
          <span
            x-data="{ buka: '07:00', tutup: '21:30' }"
            class="font-medium"
            x-text="`Buka ${buka} - ${tutup} WIB`"
          ></span>
          <span
            class="w-2 h-2 bg-green-500 rounded-full animate-pulse"
          ></span>
        </div>
      </div>
    </div>
  </div>
</section>
